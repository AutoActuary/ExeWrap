name: Debug Windows ARM access violation

on:
  push:
    branches:
      - debug/windows-arm-access-violation

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2

jobs:
  reproduce:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install native ARM64 Zig
        shell: pwsh
        run: |
          $name = "zig-aarch64-windows-$env:ZIG_VERSION"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $dest = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/$name.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Reproduce and collect dumps
        shell: pwsh
        run: ./diagnostics/run-windows-arm.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm-access-violation
          path: diagnostics-out
          if-no-files-found: warn
