name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Rust version
        run: rustc --version

      - name: Install lint components
        run: rustup component add clippy rustfmt

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  build-windows:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - label: windows-x86
            target: i686-pc-windows-msvc
            runner: windows-latest
          - label: windows-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build Windows executables
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Run Windows smoke tests
        shell: pwsh
        env:
          EXEWRAP_BIN_DIR: target/${{ matrix.target }}/release
        run: ./tests/smoke-windows.ps1

      - name: Upload CI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ExeWrap-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/ExeWrap-console.exe
            target/${{ matrix.target }}/release/ExeWrap-windowed.exe
            target/${{ matrix.target }}/release/ExeWrap-stamper.exe
          if-no-files-found: error
